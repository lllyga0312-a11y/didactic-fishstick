# Deploys the inquiry forwarder in worker/ to Cloudflare. Run it by hand from
# the Actions tab once these repository secrets exist:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FEISHU_WEBHOOK
name: Deploy inquiry forwarder

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            FEISHU_WEBHOOK
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
